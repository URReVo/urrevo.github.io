name: ImposterGames

options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: 5.0
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1

targets:
  ImposterGames:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: ImposterGames
        excludes:
          - Resources/Content/**
      - path: ImposterGames/Resources/Content
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.urrevo.impostergames
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Imposter Games
        INFOPLIST_KEY_NSMotionUsageDescription: Imposter Games nutzt Bewegungssensoren für die Wippsteuerung in Scharade.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic

  ImposterGamesTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: ImposterGamesTests
    dependencies:
      - target: ImposterGames
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  ImposterGames:
    build:
      targets:
        ImposterGames: all
    test:
      targets:
        - ImposterGamesTests
