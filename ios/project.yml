name: ImposterGames
options:
  bundleIdPrefix: de.urrevo
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  ImposterGames:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ImposterGames
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.urrevo.impostergames
        PRODUCT_NAME: ImposterGames
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Imposter Games"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_NSMotionUsageDescription: "Scharade nutzt die Bewegungssensoren, um Richtig und Überspringen durch Wippen zu erkennen."
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"

  ImposterGamesTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ImposterGamesTests
    dependencies:
      - target: ImposterGames
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.urrevo.impostergames.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  ImposterGames:
    build:
      targets:
        ImposterGames: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - ImposterGamesTests
    archive:
      config: Release
