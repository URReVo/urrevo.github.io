name: Cleanup R14 branch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cleanup-r14-branch.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete R14 development branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh api --method DELETE "repos/$GH_REPO/git/refs/heads/v74r14-personal-flow"
