name: Prototype P2 visual audit
on:
  push:
    branches: ["prototype/party-makeover-p2-audit"]
    paths-ignore:
      - "experiments/prototype/audit-shots/**"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Static validation
        run: |
          node scripts/audit-full.mjs
          node scripts/validate-release.mjs
          node scripts/test-progress-integrity.mjs
          node scripts/validate-ios-readiness.mjs

      - name: Start local server
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 > /tmp/prototype-http.log 2>&1 &
          echo $! > /tmp/prototype-http.pid
          sleep 2

      - name: Capture responsive screenshots
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium-browser || command -v chromium || true)"
          test -n "$CHROME"
          OUT="experiments/prototype/audit-shots"
          rm -rf "$OUT"
          mkdir -p "$OUT"

          shot() {
            name="$1"; size="$2"; path="$3"
            "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars               --force-device-scale-factor=1 --window-size="$size"               --virtual-time-budget=3000               --screenshot="$OUT/$name.png"               "http://127.0.0.1:8080/experiments/prototype/$path"
          }

          shot launcher-small "375,667" ""
          shot launcher-standard "390,844" ""
          shot launcher-17pro "402,874" ""
          shot launcher-large "430,932" ""
          shot circa-17pro "402,874" "games/circa-imposter/"
          shot classic-17pro "402,874" "games/classic-imposter/"
          shot whoami-17pro "402,874" "games/who-am-i/"
          shot charades-17pro "402,874" "games/charades/"
          shot personal-17pro "402,874" "games/personal-impostor/"

      - name: Commit audit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/prototype/audit-shots
          git diff --cached --quiet && exit 0
          git commit -m "chore: add P2 visual audit screenshots [skip ci]"
          git push origin HEAD:prototype/party-makeover-p2-audit
