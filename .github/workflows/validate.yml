name: Validate release

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Validate release
        run: node scripts/validate-release.mjs
      - name: Validate iOS readiness
        run: node scripts/validate-ios-readiness.mjs
