name: iOS signed IPA

on:
  workflow_dispatch:
    inputs:
      export_method:
        description: IPA distribution method
        required: true
        default: development
        type: choice
        options:
          - development
          - ad-hoc

permissions:
  contents: read

jobs:
  ipa:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate signing configuration
        env:
          TEAM_ID: ${{ vars.IOS_TEAM_ID }}
          BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
          CERTIFICATE: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          test -n "$TEAM_ID" || { echo "Missing repository variable IOS_TEAM_ID"; exit 1; }
          test -n "$BUNDLE_ID" || { echo "Missing repository variable IOS_BUNDLE_ID"; exit 1; }
          test -n "$CERTIFICATE" || { echo "Missing secret IOS_CERTIFICATE_BASE64"; exit 1; }
          test -n "$CERTIFICATE_PASSWORD" || { echo "Missing secret IOS_CERTIFICATE_PASSWORD"; exit 1; }
          test -n "$PROFILE" || { echo "Missing secret IOS_PROVISIONING_PROFILE_BASE64"; exit 1; }

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          cd ios
          xcodegen generate

      - name: Import signing certificate
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}

      - name: Install provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          PROFILE_PATH="$RUNNER_TEMP/ImposterGames.mobileprovision"
          echo "$PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          security cms -D -i "$PROFILE_PATH" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$RUNNER_TEMP/profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" "$RUNNER_TEMP/profile.plist")
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"

      - name: Archive
        env:
          TEAM_ID: ${{ vars.IOS_TEAM_ID }}
          BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
        run: |
          mkdir -p ios/build
          xcodebuild \
            -project ios/ImposterGames.xcodeproj \
            -scheme ImposterGames \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath ios/build/ImposterGames.xcarchive \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            archive

      - name: Create export options
        env:
          TEAM_ID: ${{ vars.IOS_TEAM_ID }}
          BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
          EXPORT_METHOD: ${{ inputs.export_method }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>$EXPORT_METHOD</string>
            <key>teamID</key>
            <string>$TEAM_ID</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key>
              <string>$PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          PLIST

      - name: Export IPA
        run: |
          mkdir -p ios/build/export
          xcodebuild \
            -exportArchive \
            -archivePath ios/build/ImposterGames.xcarchive \
            -exportPath ios/build/export \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: ImposterGames-IPA
          path: ios/build/export/*.ipa
          if-no-files-found: error
