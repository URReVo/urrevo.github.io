name: Apply V49

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v49.yml'

permissions:
  contents: write

jobs:
  apply-v49:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply V49 changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          replacements = [
              (
                  '.normalRevealScreen{justify-content:space-between}\n.normalRevealCard{margin-top:10px;margin-bottom:10px}\n.normalRevealQuestion.concealedQuestion{',
                  '.normalRevealScreen{justify-content:flex-start}\n.normalRevealScreen .stageButton{margin-top:auto}\n.normalRevealCard{margin-top:10px;margin-bottom:10px}\n.normalRevealUnitReserved{visibility:hidden}\n.normalRevealQuestion.concealedQuestion{'
              ),
              (
                  '<div id="normalRevealUnit" class="questionUnitBadge hidden">Einheit: –</div>',
                  '<div id="normalRevealUnit" class="questionUnitBadge normalRevealUnitReserved">Einheit: –</div>'
              ),
              (
                  '  var unit=byId("normalRevealUnit");\n  unit.textContent="Einheit: –";\n  unit.classList.add("hidden");',
                  '  var unit=byId("normalRevealUnit");\n  unit.textContent="Einheit: –";\n  unit.classList.add("normalRevealUnitReserved");'
              ),
              (
                  '    var unit=byId("normalRevealUnit");\n    unit.textContent="Einheit: "+(current.normalUnit||"–");\n    unit.classList.remove("hidden");',
                  '    var unit=byId("normalRevealUnit");\n    unit.textContent="Einheit: "+(current.normalUnit||"–");\n    unit.classList.remove("normalRevealUnitReserved");'
              ),
              (
                  '#handoff .handoffButton,\n#answers .stageButton{\n  flex-basis:48px!important;\n  min-height:48px!important;\n  height:48px!important;\n}',
                  '#handoff .handoffButton,\n#normalReveal .stageButton,\n#answers .stageButton{\n  flex-basis:48px!important;\n  min-height:48px!important;\n  height:48px!important;\n}'
              ),
              ('<title>Circa Impostor V48</title>', '<title>Circa Impostor V49</title>'),
          ]

          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'Required V48 pattern not found: {old[:100]}')
              s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit V49
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Deploy Circa Impostor V49"
          git push
