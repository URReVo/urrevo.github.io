name: Prototype Party Candidate
on:
  push:
    branches: ["prototype/party-makeover-r1"]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Full project audit
        run: node scripts/audit-full.mjs
      - name: Validate release
        run: node scripts/validate-release.mjs
      - name: Test local progress integrity
        run: node scripts/test-progress-integrity.mjs
      - name: Validate iOS readiness
        run: node scripts/validate-ios-readiness.mjs
