name: Apply V55
on:
  push:
    paths:
      - '.github/workflows/apply-v55.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch index.html to V55
        shell: python
        run: |
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          s=s.replace("<title>Circa Impostor V54</title>","<title>Circa Impostor V55</title>",1)
          meta='<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">'
          head='''<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
          <script>
          (function(){
            try{
              var ua=navigator.userAgent||"";
              var platform=navigator.platform||"";
              var touchMac=platform==="MacIntel"&&Number(navigator.maxTouchPoints||0)>1;
              var classicIOS=/iPhone|iPad|iPod/.test(ua);
              if(!classicIOS&&!touchMac)return;
              var major=null;
              var osMatch=ua.match(/OS (\\d+)[_.]/);
              if(osMatch)major=parseInt(osMatch[1],10);
              if(major===null&&touchMac){
                var versionMatch=ua.match(/Version\\/(\\d+)(?:\\.\\d+)?/);
                if(versionMatch)major=parseInt(versionMatch[1],10);
              }
              if(major!==27)return;
              document.documentElement.classList.add("ios27-statusbar-fix");
              var meta=document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
              if(meta)meta.setAttribute("content","default");
            }catch(e){}
          })();
          </script>'''
          if meta not in s: raise SystemExit("status meta not found")
          s=s.replace(meta,head,1)
          css='''html{background-color:var(--bg)}
          body{min-height:100%;background-color:var(--bg)}'''
          css2='''html{background-color:var(--bg)}
          body{min-height:100%;background-color:var(--bg)}
          #ios27StatusBarProbe{display:none}
          html.ios27-statusbar-fix #ios27StatusBarProbe{
            display:block;position:fixed;top:0;left:0;right:0;width:100%;
            height:1px;min-height:1px;background:#292929;pointer-events:none;z-index:2147483647;
          }'''
          if css not in s: raise SystemExit("css anchor not found")
          s=s.replace(css,css2,1)
          if "<body>\n" not in s: raise SystemExit("body not found")
          s=s.replace("<body>\n",'<body>\n<div id="ios27StatusBarProbe" aria-hidden="true"></div>\n',1)
          p.write_text(s,encoding="utf-8")
      - name: Commit V55
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Update Circa Impostor to V55" || exit 0
          git push origin main
