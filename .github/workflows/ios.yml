name: iOS native build

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "data/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - "data/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          cd ios
          xcodegen generate

      - name: Compile app and test bundle
        run: |
          xcodebuild \
            -project ios/ImposterGames.xcodeproj \
            -scheme ImposterGames \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath ios/build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build-for-testing

      - name: Upload simulator app
        uses: actions/upload-artifact@v7
        with:
          name: ImposterGames-iOS-Simulator
          path: ios/build/DerivedData/Build/Products/Debug-iphonesimulator/*.app
          if-no-files-found: error
